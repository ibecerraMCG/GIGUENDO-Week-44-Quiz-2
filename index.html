<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 44 Practice Quiz 2</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }[data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }[data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }[data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }[data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }[data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }

        [data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
            #reveal-all-container { justify-content: flex-start !important; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 44 Practice Quiz 2</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>
                
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: Uterine Drugs & Drugs in Pregnancy ---
            {
                section: "Uterine Drugs & Drugs in Pregnancy",
                fullLO: "LO1: Recognize the pharmacological mechanism of oxytocin",
                question: "A 28-year-old woman at 40 weeks gestation is admitted to the labor and delivery unit for the induction of labor. She is started on a continuous intravenous infusion of oxytocin. At the cellular level in the myometrium, this medication exerts its uterotonic effects by binding to a specific G protein-coupled receptor. Which of the following best describes the downstream intracellular signaling pathway directly activated by this receptor?",
                options: {
                    A: "Activation of adenylyl cyclase and increased cAMP",
                    B: "Activation of the PLC-IP3 pathway via Gq and G11",
                    C: "Inhibition of adenylyl cyclase via Gi",
                    D: "Opening of ligand-gated sodium channels",
                    E: "Stimulation of soluble guanylyl cyclase and increased cGMP"
                },
                correctAnswer: "B",
                rationale: "Oxytocin binds to specific G protein-coupled receptors on the myometrium that are coupled to Gq and G11. This directly activates the PLC-IP3 pathway, which ultimately leads to an increase in intracellular calcium and stimulates uterine contraction.",
                source: "Uterine Drugs and Drugs in Pregnancy PDF, Slide 7: 'Oxytocin - Mechanism of Action • Acts via specific G protein-coupled receptors • Coupled to Gq and G11, activating the PLC-IP3 pathway'"
            },
            {
                section: "Uterine Drugs & Drugs in Pregnancy",
                fullLO: "LO1: Recognize the pharmacological mechanism of oxytocin",
                question: "A 30-year-old woman receives an oxytocin infusion to augment her prolonged labor. Alongside the activation of the PLC-IP3 pathway, oxytocin further promotes robust myometrial contractions by enhancing the influx of a specific ion from the extracellular fluid. Which of the following channels is enhanced by oxytocin to facilitate this process?",
                options: {
                    A: "Ligand-gated chloride channels",
                    B: "Ligand-gated sodium channels",
                    C: "Voltage-sensitive calcium channels",
                    D: "Voltage-sensitive potassium channels",
                    E: "Voltage-sensitive sodium channels"
                },
                correctAnswer: "C",
                rationale: "In addition to activating the PLC-IP3 pathway, oxytocin enhances voltage-sensitive calcium (Ca2+) channels. This influx of calcium is critical for the robust contraction of uterine smooth muscle.",
                source: "Uterine Drugs and Drugs in Pregnancy PDF, Slide 7: 'Oxytocin - Mechanism of Action... Enhances the voltage-sensitive Ca2+ channels'"
            },
            {
                section: "Uterine Drugs & Drugs in Pregnancy",
                fullLO: "LO2: List the therapeutic applications of oxytocin",
                question: "A 35-year-old woman with preeclampsia at 38 weeks gestation requires prompt delivery of her fetus. Her cervix is favorable, but she is not experiencing spontaneous contractions. Which of the following is the pharmacological agent of choice to initiate uterine contractions in this patient?",
                options: {
                    A: "Ergonovine",
                    B: "Indomethacin",
                    C: "Magnesium sulfate",
                    D: "Oxytocin",
                    E: "Terbutaline"
                },
                correctAnswer: "D",
                rationale: "Oxytocin (Pitocin) is the standard drug of choice for the induction of labor in patients who require delivery but are not in spontaneous labor.",
                source: "Uterine Drugs and Drugs in Pregnancy PDF, Slide 8: 'Clinical Use of Oxytocin • Induction of labor • Oxytocin (Pitocin) is the drug of choice to induce labor'"
            },
            {
                section: "Uterine Drugs & Drugs in Pregnancy",
                fullLO: "LO2: List the therapeutic applications of oxytocin",
                question: "A 26-year-old woman successfully delivers a healthy infant vaginally. However, twenty minutes after the delivery of the placenta, she begins to experience heavy vaginal bleeding. Palpation of the abdomen reveals a soft, \"boggy\" uterus. An intravenous infusion of oxytocin is immediately started. The primary therapeutic goal of administering oxytocin during this specific stage of parturition is to:",
                options: {
                    A: "Decrease systemic vascular resistance",
                    B: "Induce milk synthesis in the mammary glands",
                    C: "Maintain uterine contractions and tone",
                    D: "Promote targeted relaxation of the cervix",
                    E: "Suppress endogenous prostaglandin release"
                },
                correctAnswer: "C",
                rationale: "During the third stage of labor and the puerperium, oxytocin is therapeutically utilized to maintain uterine contractions and tone, which physically compresses the bleeding uterine vessels and controls post-partum hemorrhage.",
                source: "Uterine Drugs and Drugs in Pregnancy PDF, Slide 9: 'Clinical Use of Oxytocin... Third stage of labor and puerperium • Oxytocin maintains uterine contractions and tone'"
            },
            {
                section: "Uterine Drugs & Drugs in Pregnancy",
                fullLO: "LO3: Describe the effects of ergot alkaloids on uterine motility",
                question: "A 32-year-old woman experiences severe post-partum hemorrhage due to uterine atony that is unresponsive to oxytocin. The physician administers an intramuscular injection of methylergonovine (Methergine). Which of the following best describes the physiological effect of this medication on the patient's uterus?",
                options: {
                    A: "Complete relaxation of the myometrium",
                    B: "Dose-dependent forceful and prolonged contractions",
                    C: "Down-regulation of myometrial oxytocin receptors",
                    D: "Rapid, uncoordinated fibrillation of smooth muscle",
                    E: "Selective relaxation of the lower uterine segment"
                },
                correctAnswer: "B",
                rationale: "Ergot alkaloids, such as ergonovine and methylergonovine, increase the motor activity of the uterus. They produce dose-dependent contractions that are more forceful and prolonged, making them highly effective for controlling post-partum bleeding.",
                source: "Uterine Drugs and Drugs in Pregnancy PDF, Slide 13: 'Ergot Alkaloids • Alkaloids increase motor activity of the uterus • Uterine contractions are dependent on the dose of the alkaloid • Dose-dependent contractions are more forceful and prolonged'"
            },
            {
                section: "Uterine Drugs & Drugs in Pregnancy",
                fullLO: "LO3: Describe the effects of ergot alkaloids on uterine motility",
                question: "A 29-year-old woman is given an ergot alkaloid preparation to control uterine bleeding following a cesarean section. Shortly after administration, she complains of severe nausea, vomiting, and new-onset chest pain. The chest pain is a recognized adverse effect of this class of drugs and is most directly caused by which of the following mechanisms?",
                options: {
                    A: "Coronary vasospasm",
                    B: "Endocardial fibrosis",
                    C: "Myocardial infarction due to plaque rupture",
                    D: "Pericardial effusion",
                    E: "Pulmonary hypertension"
                },
                correctAnswer: "A",
                rationale: "Ergot alkaloids have potent vasoconstrictive properties. Toxicity includes stimulation of emetic centers (nausea/vomiting) and significant side effects such as coronary vasospasm, muscle pain, and tingling of extremities.",
                source: "Uterine Drugs and Drugs in Pregnancy PDF, Slide 15: 'Ergot Alkaloids • Toxicity – stimulate emetic centers (nausea and vomiting) • Side effects - coronary vasospasm, muscle pain and weakness, tingling of extremities'"
            },
            {
                section: "Uterine Drugs & Drugs in Pregnancy",
                fullLO: "LO4: Understand the classifications of uterine agents to inhibit motility",
                question: "A 24-year-old woman at 28 weeks gestation presents with regular uterine contractions and cervical dilation. She is admitted for premature labor. The obstetrician prescribes terbutaline to arrest her contractions. Which of the following best describes the pharmacological classification of this tocolytic agent?",
                options: {
                    A: "Beta-2 adrenergic receptor agonist",
                    B: "Calcium channel blocker",
                    C: "Oxytocin receptor antagonist",
                    D: "Prostaglandin synthetase inhibitor",
                    E: "Selective serotonin reuptake inhibitor"
                },
                correctAnswer: "A",
                rationale: "Terbutaline (and salbutamol) are classified as Beta-2 agonists. They are prescribed as tocolytic agents to counteract labor contractions and delay premature labor, though they carry FDA warnings regarding cardiovascular and metabolic side effects.",
                source: "Uterine Drugs and Drugs in Pregnancy PDF, Slide 19: 'Clinical Use of Drugs to Inhibit Uterine Motility • Beta2 agonists • Preferred for the treatment of premature labor • Salbutamol (Ventolin) or terbutaline can be given orally or IV'"
            },
            {
                section: "Uterine Drugs & Drugs in Pregnancy",
                fullLO: "LO4: Understand the classifications of uterine agents to inhibit motility",
                question: "A 34-year-old woman at 30 weeks gestation is admitted to the hospital with severe preeclampsia and begins actively seizing (eclampsia). Intravenous magnesium sulfate is administered. In addition to controlling the eclamptic seizures, high doses of this medication will directly exert which of the following effects on the patient's reproductive tract?",
                options: {
                    A: "Accelerate cervical ripening",
                    B: "Augment endogenous oxytocin release",
                    C: "Induce profound uterine contractions",
                    D: "Inhibit uterine motility",
                    E: "Stimulate endometrial shedding"
                },
                correctAnswer: "D",
                rationale: "Magnesium sulfate is utilized to control eclamptic seizures but also functions as a tocolytic agent by inhibiting uterine motility. It is used as an alternative to Beta-2 agonists for this purpose.",
                source: "Uterine Drugs and Drugs in Pregnancy PDF, Slide 20: 'Clinical Use of Drugs to Inhibit Uterine Motility • Magnesium sulfate • Given to control eclamptic seizures and inhibit uterine motility'"
            },

            // --- Section 2: Contraceptives and Lactation ---
            {
                section: "Contraceptives and Lactation",
                fullLO: "LO1a: Name and describe the stages of postpartum lactation: Anatomical changes in the mammary glands",
                question: "A 28-year-old woman is currently in her second trimester (midpregnancy) of her first pregnancy. As her mammary glands undergo mammogenesis, which of the following anatomical changes is actively occurring at this specific stage?",
                options: {
                    A: "Alveoli dilate and secrete mature milk",
                    B: "Alveoli enlarge and acquire a central lumen",
                    C: "The glands completely regress to a resting state",
                    D: "The system consists solely of ducts with very few alveoli",
                    E: "Vascular spiders form prominently over the areola"
                },
                correctAnswer: "B",
                rationale: "During mammogenesis, the mammary glands undergo specific sequential anatomical changes. Prior to pregnancy, there are only ducts with few alveoli. In early pregnancy, alveoli grow. In midpregnancy, the alveoli enlarge and acquire a lumen. During lactation, they dilate.",
                source: "Lactation and Contraception PDF, Slide 4: 'Changes in the mammary glands during pregnancy... 3) In midpregnancy, alveoli enlarge and acquire lumen'"
            },
            {
                section: "Contraceptives and Lactation",
                fullLO: "LO1b: Name and describe the stages of postpartum lactation: Hormonal changes driving anatomical changes",
                question: "A 24-year-old woman at 32 weeks gestation undergoes a routine prenatal evaluation. Her breasts have enlarged significantly due to active mammogenesis. The intense growth of her alveolar cells during this specific stage of pregnancy is primarily driven by elevated levels of which of the following hormone combinations?",
                options: {
                    A: "Dopamine and Thyroid Stimulating Hormone",
                    B: "Human Chorionic Gonadotropin and Relaxin",
                    C: "Luteinizing Hormone and Follicle Stimulating Hormone",
                    D: "Oxytocin and Prolactin",
                    E: "Progesterone and Estrogen"
                },

            },

                fullLO: "LO4: Introduce the basics of prenatal care",
                question: "A 30-year-old woman presents for her very first prenatal visit at 8 weeks gestation. A comprehensive panel of standard laboratory tests is drawn. Along with blood typing, CBC, and urinalysis, the standard initial prenatal lab panel mandates screening for specific infectious diseases to ensure the health of both the mother and the fetus. Which of the following sets of infectious diseases is standardly tested at this initial visit?",
                options: {
                    A: "Cytomegalovirus, Toxoplasmosis, and Parvovirus B19",
                    B: "Epstein-Barr virus, West Nile Virus, and Zika virus",
                    C: "Human papillomavirus (HPV), Herpes simplex virus, and Adenovirus",

                },
                correctAnswer: "D",
                rationale: "The standard panel of laboratory tests obtained at the first prenatal visit specifically includes screening for Rubella immunity, Hepatitis B antigen, Hepatitis C antibody, Syphilis (RPR/VDRL), HIV, and GC/chlamydia/trichomoniasis.",
                source: "Physiologic Changes of Pregnancy PDF, Slide 53: 'Prenatal Care: Initial Labs • A standard panel of laboratory tests should be obtained at the first prenatal visit: ... Rubella immunity; Hepatitis B antigen; Hepatitis C antibody • Syphilis (RPR/VDRL); HIV; GC, chlamydia, trichomoniasis'"

        ];

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');
        const sectionNav = document.getElementById('section-nav');
        const customBuilder = document.getElementById('custom-builder');
        const rootElements = document.documentElement;

        let isRevealed = false;

        function toggleAllLOs() {
            isRevealed = !isRevealed;
            const btn = document.getElementById('reveal-all-btn');
            btn.textContent = isRevealed ? "Hide Learning Objectives" : "Show Learning Objectives";
            
            document.querySelectorAll('.lo-box').forEach(box => {
                box.style.display = isRevealed ? 'block' : 'none';
            });
        }

        function initQuiz() {
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    const sectionId = 'sec-' + sectionIndex;
                    
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    const navBtn = document.createElement('button');
                    let btnText = currentSection;
                    if (btnText.includes("Uterine Drugs & Drugs in Pregnancy")) btnText = "Uterine Drugs";
                    if (btnText.includes("Contraceptives and Lactation")) btnText = "Contraceptives & Lactation";
                    if (btnText.includes("Pathology of the Breast")) btnText = "Breast Pathology";
                    if (btnText.includes("Physiological Changes of Pregnancy")) btnText = "Pregnancy Physiology";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
</body>
</html>
